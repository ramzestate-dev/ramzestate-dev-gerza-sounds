name: Build sound library release

# Downloads every pack in sources/opengameart.json, converts and sorts the sounds, commits
# CATALOG.csv and licenses/, and publishes one zip per category as assets of a release.
# The sounds themselves are never committed to git.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1
      limit:
        description: Only the first N packs (0 = all), for a quick test
        default: "0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TAG: ${{ inputs.tag }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install --quiet py7zr

      - name: Build library
        run: python3 tools/build.py --out "$RUNNER_TEMP/build" --jobs 8 --limit "$LIMIT"

      - name: Keep build stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats
          path: ${{ runner.temp }}/build/stats.json
          if-no-files-found: ignore

      - name: Commit catalog and licences
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CATALOG.csv licenses
          if git diff --cached --quiet; then echo "catalog unchanged"; else
            git commit -m "Catalog and licences for $TAG"
            git push
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # gh runs outside the checkout here
        run: |
          cd "$RUNNER_TEMP/build/dist"
          ls -la
          python3 - <<'PY' > notes.md
          import json, os
          s = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "build", "stats.json")))
          print(f"{s['sounds']} sounds, CC0 from OpenGameArt.org. Search them with get-sound.sh; see CATALOG.csv.\n")
          print("| Category | Sounds |\n|---|---|")
          for c, n in s["by_category"].items():
              print(f"| {c} | {n} |")
          print(f"\nNON-COMMERCIAL sounds: {s['non_commercial_sounds']}")
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.zip --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" ./*.zip --title "Sound library $TAG" --notes-file notes.md
          fi
